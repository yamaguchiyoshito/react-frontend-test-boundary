<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="484" viewBox="0 0 1000 484" role="img" aria-label="顧客検索画面の構成と検証の範囲" aria-describedby="desc">
<desc id="desc">CustomerSearchPage（顧客検索画面）の枠の中に、上段「SearchForm（検索フォーム：顧客名・区分）」「CustomerTable（検索結果：一覧・件数）」、下段「Schema・変換関数（バリデーション・変換）」「カスタムHook（useCustomerSearch）」「API Client（リクエスト・応答処理）」の箱を置き、箱同士を紫の線で、API Clientと枠外の「Backend API／Database」を橙の線で結び、右に「単体テスト：箱の中（個別の責務）」「FE内部結合テスト：箱と箱の間（責務間の連携）」「FE・BE結合テスト：Backendとの線（実API）」の凡例を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">箱の中は単体、箱と箱の間はFE内部結合、Backendとの線はFE・BE結合</text>
<rect x="60" y="90" width="580" height="250" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="80" y="114" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">CustomerSearchPage（顧客検索画面）</text>
<path d="M211.0 210.0 L350.0 250.0" stroke="#8a6cc1" stroke-width="3" fill="none"/>
<path d="M489.0 210.0 L350.0 250.0" stroke="#8a6cc1" stroke-width="3" fill="none"/>
<path d="M435.0 285.0 L450.0 285.0" stroke="#8a6cc1" stroke-width="3" fill="none"/>
<path d="M250.0 285.0 L265.0 285.0" stroke="#8a6cc1" stroke-width="3" fill="none"/>
<path d="M535.0 320.0 L535.0 366.0" stroke="#c0604a" stroke-width="3" fill="none"/>
<rect x="80" y="126" width="262" height="84" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="211" y="164" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">SearchForm</text><text x="211" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">検索フォーム：顧客名・区分</text>
<rect x="358" y="126" width="262" height="84" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="489" y="164" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">CustomerTable</text><text x="489" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">検索結果：一覧・件数</text>
<rect x="80" y="250" width="170" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="165" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">Schema・変換関数</text><text x="165" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">バリデーション・変換</text>
<rect x="265" y="250" width="170" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="350" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">カスタムHook</text><text x="350" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">useCustomerSearch</text>
<rect x="450" y="250" width="170" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="535" y="281" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">API Client</text><text x="535" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">リクエスト・応答処理</text>
<rect x="80" y="366" width="540" height="50" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1" stroke-dasharray="8 6"/><text x="350" y="398" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#9c3f2a">Backend API／Database</text>
<rect x="680" y="96" width="260" height="72" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="810" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">単体テスト</text><text x="810" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">箱の中：個別の責務</text>
<rect x="680" y="186" width="260" height="72" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="810" y="214" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#6a4ea6">FE内部結合テスト</text><text x="810" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">箱と箱の間：責務間の連携</text>
<rect x="680" y="276" width="260" height="72" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="810" y="304" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#9c3f2a">FE・BE結合テスト</text><text x="810" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Backendとの線：実API</text>
<text x="500" y="456" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">どの箱を見るかではなく、箱の中か、箱の間か、Backendとの線かで区分が決まる</text>
</svg>
