<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-label="コンポーネント操作テストの対象と検証" aria-describedby="desc">
<desc id="desc">左の「クリック」「テキスト入力」「キーボード操作」「フォーカス移動」から中央の「コンポーネント（検索フォーム・ダイアログなど）」へ矢印を集め、右の「観測できる結果（表示・活性／非活性・イベント発火）」へ矢印を引き、下に破線の箱「内部実装やStateの値、DOM構造の詳細は検証しない」を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">利用者の操作を与え、画面から観測できる結果だけを検証する</text>
<path d="M230.0 128.0 L292.7 187.1" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 286.5,190.9 296.1,180.7" fill="#607a91"/><rect x="60" y="111" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="133" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">クリック</text><path d="M230.0 172.0 L290.5 191.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 286.5,197.1 290.7,183.7" fill="#607a91"/><rect x="60" y="155" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="177" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">テキスト入力</text><path d="M230.0 216.0 L290.5 197.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 290.7,204.3 286.5,190.9" fill="#607a91"/><rect x="60" y="199" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="221" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">キーボード操作</text><path d="M230.0 260.0 L292.7 200.9" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 296.1,207.3 286.5,197.1" fill="#607a91"/><rect x="60" y="243" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="265" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">フォーカス移動</text>
<rect x="300" y="140" width="260" height="108" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="430" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">コンポーネント</text><text x="430" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">検索フォーム・ダイアログなど</text>
<path d="M560.0 194.0 L610.0 194.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="620.0,194.0 608.0,201.0 608.0,187.0" fill="#607a91"/>
<rect x="620" y="140" width="320" height="108" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="780" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">観測できる結果</text><text x="780" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">表示・活性／非活性・イベント発火</text>
<rect x="60" y="288" width="880" height="44" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="8 6"/><text x="500" y="317" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">内部実装やStateの値、DOM構造の詳細は検証しない</text>
<text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">利用者がソフトウェアを使う方法に近いテストほど信頼できる（Testing Library）</text>
</svg>
