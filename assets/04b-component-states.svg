<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" role="img" aria-label="コンポーネントの4つの表示状態" aria-describedby="desc">
<desc id="desc">検索結果テーブルの4つの表示状態「正常（C001 山田 太郎、C002 山田 花子、C003 山田商事の3行）」「Loading（読み込み中…）」「Empty（該当するデータがありません）」「Error（データ取得に失敗しました）」を小さな枠で並べ、それぞれから下の「Storyとして定義し、表示テストの入力にする（デザイン確認とテスト資産を共通化する）」へ矢印を引いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">表示状態ごとにStoryを定義し、デザイン確認とテストで共有する</text>
<rect x="60" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="155" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">正常</text>
<rect x="75" y="136" width="160" height="22" rx="4" fill="#d6e6f2" stroke="#8ea6b2" stroke-width="1"/>
<text x="83" y="153" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">C001 山田 太郎</text>
<rect x="75" y="160" width="160" height="22" rx="4" fill="#d6e6f2" stroke="#8ea6b2" stroke-width="1"/>
<text x="83" y="177" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">C002 山田 花子</text>
<rect x="75" y="184" width="160" height="22" rx="4" fill="#d6e6f2" stroke="#8ea6b2" stroke-width="1"/>
<text x="83" y="201" text-anchor="start" font-family="sans-serif" font-size="14" fill="#223e53">C003 山田商事</text>
<path d="M155.0 220.0 L155.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="155.0,254.0 148.0,242.0 162.0,242.0" fill="#607a91"/>
<rect x="290" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="385" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Loading</text>
<text x="385" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">読み込み中…</text>
<path d="M385.0 220.0 L385.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="385.0,254.0 378.0,242.0 392.0,242.0" fill="#607a91"/>
<rect x="520" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="615" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Empty</text>
<text x="615" y="168" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">該当するデータが</text><text x="615" y="188" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#55646d">ありません</text>
<path d="M615.0 220.0 L615.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="615.0,254.0 608.0,242.0 622.0,242.0" fill="#607a91"/>
<rect x="750" y="96" width="190" height="124" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="845" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Error</text>
<text x="845" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9c3f2a">データ取得に失敗しました</text>
<path d="M845.0 220.0 L845.0 244.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="845.0,254.0 838.0,242.0 852.0,242.0" fill="#607a91"/>
<rect x="60" y="254" width="880" height="56" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="500" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">Storyとして定義し、表示テストの入力にする</text><text x="500" y="302" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">デザイン確認とテスト資産を共通化する</text>
<text x="500" y="350" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Loading・Empty・Errorは、状態として定義しなければ検証されない</text>
</svg>
