<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-label="バリデーションテストの対象と検証" aria-describedby="desc">
<desc id="desc">左の「正常な入力」「境界の入力」「不正な入力」から中央の「バリデーションSchema（必須・文字数・文字種・範囲・相関）」へ矢印を集め、右の「通過：値をそのまま返す」「エラー：項目ごとのメッセージ」の2つへ矢印を分け、下に破線の箱「フォームや画面を起動せず、Schemaだけで検証する」を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">Schemaに入力を通し、通過するかとエラーメッセージを検証する</text>
<path d="M230.0 150.0 L272.5 187.4" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="280.0,194.0 266.4,191.3 275.6,180.8" fill="#607a91"/><rect x="60" y="133" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">正常な入力</text><path d="M230.0 194.0 L270.0 194.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="280.0,194.0 268.0,201.0 268.0,187.0" fill="#607a91"/><rect x="60" y="177" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">境界の入力</text><path d="M230.0 238.0 L272.5 200.6" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="280.0,194.0 275.6,207.2 266.4,196.7" fill="#607a91"/><rect x="60" y="221" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="243" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">不正な入力</text>
<rect x="280" y="140" width="280" height="108" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="420" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">バリデーションSchema</text><text x="420" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">必須・文字数・文字種・範囲・相関</text>
<path d="M560.0 194.0 L611.7 158.6" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="620.0,153.0 614.0,165.5 606.1,154.0" fill="#607a91"/>
<path d="M560.0 194.0 L611.7 229.4" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="620.0,235.0 606.1,234.0 614.0,222.5" fill="#607a91"/>
<rect x="620" y="128" width="320" height="50" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="780" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">通過：値をそのまま返す</text>
<rect x="620" y="210" width="320" height="50" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="780" y="242" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">エラー：項目ごとのメッセージ</text>
<rect x="60" y="288" width="880" height="44" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="8 6"/><text x="500" y="317" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">フォームや画面を起動せず、Schemaだけで検証する</text>
<text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Zodなどで入力制約を画面から分離しておくことが前提</text>
</svg>
