<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="416" viewBox="0 0 1000 416" role="img" aria-label="テストレベルと開発工程の対応" aria-describedby="desc">
<desc id="desc">FE単体、FE内部結合、FE・BE結合、ST（システムテスト）の4段階の上に「PG・UT工程」（左2段）「IT工程」「ST工程」のブラケットを置き、下にそれぞれの完了条件「Backendに依存せず、Frontendの機能要求を満たしている（FE内部結合テストは、テスト技法上は結合テストでも、この工程に含める）」「実Backendとの連携を含めて機能要求を満たす」「システム全体として業務・非機能要求を満たす」のカードを置き、左2段を「Backendチームと並行して進められる」のブラケットで括った図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">FE内部結合は技法上は結合テスト、管理上はPG・UT工程に含める</text>
<path d="M60.0 100 V112 H494.0 V100" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">PG・UT工程</text>
<path d="M506.0 100 V112 H717.0 V100" stroke="#223e53" stroke-width="2" fill="none"/><text x="612" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">IT工程</text>
<path d="M729.0 100 V112 H940.0 V100" stroke="#223e53" stroke-width="2" fill="none"/><text x="834" y="90" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST工程</text>
<path d="M165.5 139.0 L952.0 139.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,139.0 950.0,146.0 950.0,132.0" fill="#607a91"/><rect x="60" y="120" width="211" height="38" rx="19.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">FE単体</text><rect x="283" y="120" width="211" height="38" rx="19.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="388" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">FE内部結合</text><rect x="506" y="120" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE・BE結合</text><rect x="729" y="120" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="144" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST（システムテスト）</text>
<rect x="60" y="184" width="434" height="96" rx="12" fill="#e0f0e9" stroke="#5aa06f" stroke-width="1"/><text x="277" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">完了条件</text><text x="277" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Backendに依存せず、Frontendの機能要求を満たしている</text><text x="277" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">FE内部結合テストは技法上は結合テストでも、この工程に含める</text>
<rect x="506" y="184" width="211" height="96" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">完了条件</text><text x="612" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">実Backendとの連携を</text><text x="612" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">含めて機能要求を満たす</text>
<rect x="729" y="184" width="211" height="96" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="214" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">完了条件</text><text x="834" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">システム全体として</text><text x="834" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務・非機能要求を満たす</text>
<path d="M60.0 312 V300 H494.0 V312" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="333" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">Backendチームと並行して進められる</text>
<text x="500" y="388" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Frontendの工程完了を、Backendの完成に依存させずに判定できる</text>
</svg>
