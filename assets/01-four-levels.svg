<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img" aria-label="4段階のテストレベルとAPI接続" aria-describedby="desc">
<desc id="desc">FE単体、FE内部結合、FE・BE結合、ST（システムテスト）の4段階を左から右へ1本の矢印でつなぎ、それぞれの下に「個別の責務（API接続：なし／Mock）」「責務間の連携（API接続：原則Mock）」「実APIとの連携（API接続：実API）」「業務シナリオ（API接続：実API＋外部接続）」を置き、左2列を「Backendの完成を待たずに実施できる」、右2列を「実Backendが要る」のブラケットで括った図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">単体と結合の間にFE内部結合を置き、Backendの完成を待たずに進める</text>
<path d="M165.5 115.0 L952.0 115.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,115.0 950.0,122.0 950.0,108.0" fill="#607a91"/><rect x="60" y="96" width="211" height="38" rx="19.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">FE単体</text><rect x="283" y="96" width="211" height="38" rx="19.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="388" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">FE内部結合</text><rect x="506" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE・BE結合</text><rect x="729" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST（システムテスト）</text>
<rect x="60" y="160" width="211" height="70" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">個別の責務</text><text x="166" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API接続：なし／Mock</text>
<rect x="283" y="160" width="211" height="70" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="388" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">責務間の連携</text><text x="388" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API接続：原則Mock</text>
<rect x="506" y="160" width="211" height="70" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="612" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#9c3f2a">実APIとの連携</text><text x="612" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API接続：実API</text>
<rect x="729" y="160" width="211" height="70" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="834" y="191" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#9c3f2a">業務シナリオ</text><text x="834" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API接続：実API＋外部接続</text>
<path d="M60.0 264 V252 H494.0 V264" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="285" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">Backendの完成を待たずに実施できる</text>
<path d="M506.0 264 V252 H940.0 V264" stroke="#9c3f2a" stroke-width="2" fill="none"/><text x="723" y="285" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">実Backendが要る</text>
<text x="500" y="330" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">区分を決めるのは、テスト対象の大きさや使う道具ではなく、依存先との接続範囲</text>
</svg>
