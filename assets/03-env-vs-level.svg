<text x="306" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">Storybookで</text><text x="306" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">コンポーネントだけ</text>
<rect x="403" y="218" width="171" height="60" rx="6" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/>
<text x="488" y="244" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">Vitest＋jsdomで</text><text x="488" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">画面全体の連携</text>
<text x="306" y="185" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ロジック・Store</text>
<text x="306" y="253" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">コンポーネント</text>
<text x="488" y="312" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Storybookと</text><text x="488" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Playwrightで画面遷移</text>
<text x="672" y="389" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">実APIとの結合</text>
<text x="854" y="389" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務シナリオ</text>
<text x="500" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">実ブラウザ（Storybook）でも対象がコンポーネントだけなら単体。Vitestでも連携を見れば内部結合</text>
</svg>
