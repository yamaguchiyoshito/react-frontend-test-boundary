<rect x="220" y="218" width="171" height="60" rx="6" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
<rect x="403" y="218" width="171" height="60" rx="6" fill="#fcfdfd" stroke="#8ea6b2" stroke-width="1"/>
