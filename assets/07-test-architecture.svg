<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448" role="img" aria-label="概念上のテスト配分" aria-describedby="desc">
<desc id="desc">上から「E2E・ST（業務シナリオ）」「FE・BE結合（実API）：Playwright」「FE内部結合（画面全体・画面遷移）：Testing Library＋MSW／Playwright＋MSW」「コンポーネントの表示・操作：Testing Library・Storybook」「ロジック・Schema・Hooks・Store：Vitest（最も多く、最も速い）」の5層を、下ほど幅が広い段々のピラミッドとして積み、右端の下から上への矢印に「速い・多い」から「実環境」へと記した図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">下の層ほど速く安定し、数が多い。上に行くほど実環境に近づく</text>
<rect x="400" y="96" width="200" height="52" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="500" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">E2E・ST</text><text x="500" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務シナリオ</text>
<rect x="330" y="154" width="340" height="52" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="500" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">FE・BE結合（実API）</text><text x="500" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Playwright</text>
<rect x="260" y="212" width="480" height="52" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="500" y="234" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">FE内部結合（画面全体・画面遷移）</text><text x="500" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Testing Library＋MSW／Playwright＋MSW</text>
<rect x="190" y="270" width="620" height="52" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="500" y="292" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">コンポーネントの表示・操作</text><text x="500" y="316" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Testing Library・Storybook</text>
<rect x="120" y="328" width="760" height="52" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="500" y="350" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">ロジック・Schema・Hooks・Store</text><text x="500" y="374" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Vitest：最も多く、最も速い</text>
<path d="M950.0 376.0 L950.0 120.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="950.0,110.0 957.0,122.0 943.0,122.0" fill="#607a91"/><text x="950" y="98" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">実環境</text><text x="950" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">速い・多い</text>
<text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">概念上の配分であり、テストケース数の固定比率ではない</text>
</svg>
