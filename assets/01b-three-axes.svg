<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="テストを分ける3つの軸" aria-describedby="desc">
<desc id="desc">「大きさ」の軸に関数・コンポーネント・画面・システム、「実行環境」の軸にNode.js・仮想DOM・実ブラウザ、「Backend接続」の軸になし・Mock・実APIを、それぞれ左から右への矢印で並べ、コンポーネントの下に「コンポーネント単位だから単体」？、実ブラウザの下に「ブラウザを使うから結合」？と疑問を添え、Backend接続の軸をブラケットで括って「本記事の区分は、この軸（依存先との接続範囲）で決める」とした図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">大きさ・実行環境・Backend接続は別々の軸。区分は接続範囲で決める</text>
<rect x="60" y="100" width="150" height="38" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="135" y="126" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">大きさ</text>
<path d="M314.2 119.0 L952.0 119.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,119.0 950.0,126.0 950.0,112.0" fill="#607a91"/><rect x="230" y="100" width="168" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="314" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">関数</text><rect x="410" y="100" width="168" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="495" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">コンポーネント</text><rect x="591" y="100" width="168" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="675" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">画面</text><rect x="772" y="100" width="168" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="856" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">システム</text>
<rect x="60" y="170" width="150" height="38" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="135" y="196" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">実行環境</text>
<path d="M344.3 189.0 L952.0 189.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,189.0 950.0,196.0 950.0,182.0" fill="#607a91"/><rect x="230" y="170" width="229" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="344" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Node.js</text><rect x="471" y="170" width="229" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="585" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">仮想DOM</text><rect x="711" y="170" width="229" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="826" y="194" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">実ブラウザ</text>
<rect x="60" y="240" width="150" height="38" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="135" y="266" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">Backend接続</text>
<path d="M344.3 259.0 L952.0 259.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,259.0 950.0,266.0 950.0,252.0" fill="#607a91"/><rect x="230" y="240" width="229" height="38" rx="19.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="344" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">なし</text><rect x="471" y="240" width="229" height="38" rx="19.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="585" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">Mock</text><rect x="711" y="240" width="229" height="38" rx="19.0" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="826" y="264" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">実API</text>
<text x="495" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">「コンポーネント単位だから単体」？</text>
<text x="826" y="226" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9c3f2a">「ブラウザを使うから結合」？</text>
<path d="M230 308 V296 H940 V308" stroke="#223e53" stroke-width="2" fill="none"/><text x="585" y="329" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">本記事の区分は、この軸（依存先との接続範囲）で決める</text>
<text x="500" y="372" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">3つの軸が混ざると、同じテストを単体と呼ぶ人と結合と呼ぶ人が出て、何を保証したのか判断できない</text>
</svg>
