<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="428" viewBox="0 0 1000 428" role="img" aria-label="APIクライアントテストの対象と検証" aria-describedby="desc">
<desc id="desc">左の「検索条件・登録データ」から「API Client（リクエスト生成・応答処理）」へ、さらに「MSW（200／400／401・403／500／通信失敗を再現）」へ矢印を引き、API Clientの下に「検証：リクエストの組み立て（Query Parameter・Request Body）」、MSWの下に「検証：応答ごとの処理（正常・入力エラー・認証認可・サーバーエラー・リトライ）」を線で結び、下に橙の破線の箱「実Backendとの整合は保証できない：契約テストとFE・BE結合テストで担保する」を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">MSWで応答を差し替え、リクエストの組み立てと応答の処理を検証する</text>
<rect x="60" y="130" width="200" height="40" rx="20.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="160" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">検索条件・登録データ</text>
<path d="M260.0 150.0 L290.0 150.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,150.0 288.0,157.0 288.0,143.0" fill="#607a91"/>
<rect x="300" y="110" width="240" height="80" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="420" y="146" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">API Client</text><text x="420" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">リクエスト生成・応答処理</text>
<path d="M540.0 150.0 L590.0 150.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="600.0,150.0 588.0,157.0 588.0,143.0" fill="#607a91"/>
<rect x="600" y="110" width="340" height="80" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="770" y="146" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#6a4ea6">MSW</text><text x="770" y="170" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">200／400／401・403／500／通信失敗を再現</text>
<path d="M420.0 190.0 L420.0 230.0" stroke="#607a91" stroke-width="2" fill="none"/>
<path d="M770.0 190.0 L770.0 230.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<rect x="260" y="230" width="320" height="60" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="420" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">検証：リクエストの組み立て</text><text x="420" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Query Parameter・Request Body</text>
<rect x="600" y="230" width="340" height="60" rx="12" fill="#fcfdfd" stroke="#8a6cc1" stroke-width="1"/><text x="770" y="256" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">検証：応答ごとの処理</text><text x="770" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">正常・入力エラー・認証認可・サーバーエラー</text>
<rect x="60" y="320" width="880" height="44" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1" stroke-dasharray="8 6"/><text x="500" y="349" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#9c3f2a">実Backendとの整合は保証できない：契約テストとFE・BE結合テストで担保する</text>
<text x="500" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">Backendがなくても、通信処理の正常系と異常系をすべて再現できる</text>
</svg>
