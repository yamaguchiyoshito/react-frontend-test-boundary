<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-label="Hooksテストの対象と検証" aria-describedby="desc">
<desc id="desc">上に「useCustomerSearch（公開インターフェース：stateと関数）」、その下に「初期状態」「非同期処理中」「成功／エラー」「再取得・キャンセル・解放」の4状態を左から右へ1本の矢印でつなぎ、各状態の下に「初期値が正しい」「loading が true」「data または error」「リソースを解放する」を添え、下に破線の箱「コンポーネントを描画せず、renderHookでHookを直接呼び出す」を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">Hookを直接呼び出し、公開されたstateの遷移と副作用の扱いを検証する</text>
<rect x="300" y="96" width="400" height="60" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="500" y="122" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">useCustomerSearch</text><text x="500" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">公開インターフェース：stateと関数</text>
<text x="500" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#36556d">Hookが返す state の遷移</text>
<path d="M165.5 223.0 L952.0 223.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,223.0 950.0,230.0 950.0,216.0" fill="#607a91"/><rect x="60" y="204" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="166" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">初期状態</text><rect x="283" y="204" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="388" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">非同期処理中</text><rect x="506" y="204" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">成功／エラー</text><rect x="729" y="204" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="228" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">再取得・キャンセル・解放</text>
<text x="166" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">初期値が正しい</text>
<text x="388" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">loading が true</text>
<text x="612" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">data または error</text>
<text x="834" y="270" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">リソースを解放する</text>
<rect x="60" y="300" width="880" height="44" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="8 6"/><text x="500" y="329" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">コンポーネントを描画せず、renderHookでHookを直接呼び出す</text>
<text x="500" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">検証するのは公開された state と関数であり、内部の実装ではない</text>
</svg>
