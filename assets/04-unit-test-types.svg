<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-label="8種別が検証する範囲" aria-describedby="desc">
<desc id="desc">左から「純粋な処理：① ロジックテスト、② バリデーションテスト（対象：関数・Schema）」「状態：③ Hooksテスト、④ 状態管理テスト（対象：Hook・Store）」「コンポーネント：⑤ 表示テスト、⑥ 操作テスト（対象：Props・イベント）」「通信：⑦ APIクライアントテスト（対象：リクエスト・応答）」の4枚のカードを並べ、その下に全幅の帯「⑧ コンポーネント品質テスト（視覚的品質・アクセシビリティ・レスポンシブ・キーボード操作・オーバーフロー。種別を横断して見る）」を置き、左から右への矢印に「UIから離れた処理：最も速く安定」「UIに近い」「外部との境界」と添えた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">8種別は、純粋な処理から通信までを個別に検証し、品質は横断で見る</text>
<rect x="60" y="96" width="205" height="118" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="162" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">純粋な処理</text><text x="162" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">① ロジックテスト</text><text x="162" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">② バリデーションテスト</text><text x="162" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">対象：関数・Schema</text>
<rect x="285" y="96" width="205" height="118" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="388" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">状態</text><text x="388" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">③ Hooksテスト</text><text x="388" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">④ 状態管理テスト</text><text x="388" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">対象：Hook・Store</text>
<rect x="510" y="96" width="205" height="118" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="612" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">コンポーネント</text><text x="612" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">⑤ 表示テスト</text><text x="612" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">⑥ 操作テスト</text><text x="612" y="196" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">対象：Props・イベント</text>
<rect x="735" y="96" width="205" height="118" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="838" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2b5f9e">通信</text><text x="838" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">⑦ APIクライアントテスト</text><text x="838" y="174" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">対象：リクエスト・応答</text>
<rect x="60" y="236" width="880" height="50" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="500" y="257" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">⑧ コンポーネント品質テスト</text><text x="500" y="281" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">視覚的品質・アクセシビリティ・レスポンシブ・キーボード操作・オーバーフロー（種別を横断して見る）</text>
<path d="M60.0 312.0 L930.0 312.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="940.0,312.0 928.0,319.0 928.0,305.0" fill="#607a91"/>
<text x="162" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">UIから離れた処理：最も速く安定</text>
<text x="612" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">UIに近い</text>
<text x="838" y="338" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">外部との境界</text>
<text x="500" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">いずれも単体テストの範囲。⑧はレベルとは別の分類軸だが、コンポーネント単位で行えるものは単体工程に含める</text>
</svg>
