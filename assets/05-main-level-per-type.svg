<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="458" viewBox="0 0 1000 458" role="img" aria-label="種別ごとの主たる検証工程" aria-describedby="desc">
<desc id="desc">FE単体、FE内部結合、FE・BE結合、ST（システムテスト）の4段階の下に、それぞれ「個別の責務（ロジック、バリデーション、Hooks・状態管理、UI表示・UI操作、VRT・a11y・レスポンシブ）」「責務間の連携（状態管理の連携、画面遷移、API通信（Mock）、UI表示・操作の連携）」「実APIとの連携（API通信（実API）、認証認可、データ永続化）」「業務シナリオ（業務シナリオ、システム全体の要求充足）」のカードを置き、左2列をブラケットで括って「主たる工程の大半はPG・UT」とした図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">各種別は、最も低コストで確実に検証できる工程を主たる工程にする</text>
<path d="M165.5 115.0 L952.0 115.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="962.0,115.0 950.0,122.0 950.0,108.0" fill="#607a91"/><rect x="60" y="96" width="211" height="38" rx="19.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">FE単体</text><rect x="283" y="96" width="211" height="38" rx="19.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="388" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">FE内部結合</text><rect x="506" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="612" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">FE・BE結合</text><rect x="729" y="96" width="211" height="38" rx="19.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="834" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">ST（システムテスト）</text>
<rect x="60" y="160" width="211" height="170" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="166" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">個別の責務</text><text x="166" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">ロジック</text><text x="166" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">バリデーション</text><text x="166" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">Hooks・状態管理</text><text x="166" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">UI表示・UI操作</text><text x="166" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">VRT・a11y・レスポンシブ</text>
<rect x="283" y="160" width="211" height="170" rx="12" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="388" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">責務間の連携</text><text x="388" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">状態管理の連携</text><text x="388" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">画面遷移</text><text x="388" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API通信（Mock）</text><text x="388" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">UI表示・操作の連携</text>
<rect x="506" y="160" width="211" height="170" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="612" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#9c3f2a">実APIとの連携</text><text x="612" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">API通信（実API）</text><text x="612" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">認証認可</text><text x="612" y="256" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">データ永続化</text>
<rect x="729" y="160" width="211" height="170" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="834" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#9c3f2a">業務シナリオ</text><text x="834" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">業務シナリオ</text><text x="834" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">システム全体の要求充足</text>
<path d="M60.0 364 V352 H494.0 V364" stroke="#2f6b45" stroke-width="2" fill="none"/><text x="277" y="385" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2f6b45">主たる工程の大半はPG・UT</text>
<text x="500" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">同じ観点をすべての工程で繰り返さず、主たる工程を1つ決め、ほかの工程は補完にとどめる</text>
</svg>
