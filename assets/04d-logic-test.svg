<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-label="ロジックテストの対象と検証" aria-describedby="desc">
<desc id="desc">左の「正常値」「境界値」「異常値」から中央の「純粋関数（金額計算・日付変換・判定）」へ矢印を集め、右の「戻り値を期待値と比較（例外・端数・境界値も含めて）」へ矢印を引き、下に破線の箱「コンポーネント・ブラウザ・APIを起動しない」を置いた図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">UIから切り離した関数に入力を与え、戻り値だけを検証する</text>
<path d="M230.0 150.0 L291.5 188.7" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 286.1,193.5 293.6,181.7" fill="#607a91"/><rect x="60" y="133" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">正常値</text><path d="M230.0 194.0 L290.0 194.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 288.0,201.0 288.0,187.0" fill="#607a91"/><rect x="60" y="177" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="199" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">境界値</text><path d="M230.0 238.0 L291.5 199.3" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="300.0,194.0 293.6,206.3 286.1,194.5" fill="#607a91"/><rect x="60" y="221" width="170" height="34" rx="17.0" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/><text x="145" y="243" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#223e53">異常値</text>
<rect x="300" y="140" width="260" height="108" rx="12" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="430" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">純粋関数</text><text x="430" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">金額計算・日付変換・判定</text>
<path d="M560.0 194.0 L610.0 194.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="620.0,194.0 608.0,201.0 608.0,187.0" fill="#607a91"/>
<rect x="620" y="140" width="320" height="108" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="780" y="190" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#223e53">戻り値を期待値と比較</text><text x="780" y="214" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#36556d">例外・端数・境界値も含めて</text>
<rect x="60" y="288" width="880" height="44" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1" stroke-dasharray="8 6"/><text x="500" y="317" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">コンポーネント・ブラウザ・APIを起動しない</text>
<text x="500" y="368" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">最も高速で安定し、AIによるテストコード生成にも向く</text>
</svg>
