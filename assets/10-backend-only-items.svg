<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432" role="img" aria-label="Mockで検証済みの事項と実Backendで検証する事項" aria-describedby="desc">
<desc id="desc">左の緑のカード「PG・UTで検証済み（Mock API）」に表示・操作・画面遷移、入力検証とエラー表示、Mock応答ごとの画面の振る舞い、画面内・画面間の連携、リクエストの組み立てを、右の橙のカード「実Backendで初めて検証できる」にAPI契約の整合、認証認可の実際、永続化とデータ整合、実データ依存、環境依存、非同期・時間依存を列挙し、間を破線で区切って「PG・UTの完了時に、右の一覧を「未検証の事項」として明示する」と記した図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">Mockで検証できる事項と、実Backendで初めて検証できる事項を分けておく</text>
<rect x="60" y="96" width="400" height="236" rx="12" fill="#e0f0e9" stroke="#5aa06f" stroke-width="1"/><text x="260" y="126" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#2f6b45">PG・UTで検証済み（Mock API）</text><text x="260" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">表示・操作・画面遷移</text><text x="260" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">入力検証とエラー表示</text><text x="260" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">Mock応答ごとの画面の振る舞い</text><text x="260" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">画面内・画面間の連携</text><text x="260" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">リクエストの組み立て</text>
<rect x="540" y="96" width="400" height="236" rx="12" fill="#f7e9d4" stroke="#c0604a" stroke-width="1"/><text x="740" y="126" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#9c3f2a">実Backendで初めて検証できる</text><text x="740" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">API契約の整合（型・必須・エラー形式）</text><text x="740" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">認証認可の実際（トークン・権限・Cookie）</text><text x="740" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">永続化とデータ整合（再検索・一意制約）</text><text x="740" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">実データ依存（件数・ソート・文字）</text><text x="740" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">環境依存（CORS・タイムアウト・サイズ）</text><text x="740" y="264" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#223e53">非同期・時間依存（バッチ・サーバー時刻）</text>
<path d="M500.0 96.0 L500.0 332.0" stroke="#8ea6b2" stroke-width="2" fill="none" stroke-dasharray="8 6"/>
<text x="500" y="362" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">PG・UTの完了時に、右の一覧を「未検証の事項」として明示する</text>
<text x="500" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">分けておけば、IT工程で見つかる不具合は接続に関するものに限られる</text>
</svg>
