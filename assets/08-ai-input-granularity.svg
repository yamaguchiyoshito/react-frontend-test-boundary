<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="432" viewBox="0 0 1000 432" role="img" aria-label="テスト生成に与える情報の粒度" aria-describedby="desc">
<desc id="desc">左の枠「単体テストの生成」には「ソースコード」「個別仕様」の2つの入力から「テストコード（Vitest）」へ矢印を引き「インプットは個別の成果物」、右の枠「FE内部結合テストの生成」には「画面仕様」「画面遷移」「状態遷移」「API契約（OpenAPI）」の4つの入力を互いに線で結んでから「テストコード（Testing Library＋MSW等）」へ矢印を引き「インプットは成果物間の関係」と記した図</desc>
<rect width="100%" height="100%" fill="#fcfdfd"/>
<text x="50" y="50" text-anchor="start" font-family="sans-serif" font-size="24" font-weight="700" fill="#18324b">単体は個別の成果物で足り、内部結合は成果物間の関係を渡す</text>
<rect x="60" y="90" width="410" height="250" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="265" y="120" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b5f9e">単体テストの生成</text>
<rect x="110" y="150" width="140" height="40" rx="20.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="180" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">ソースコード</text>
<rect x="280" y="150" width="140" height="40" rx="20.0" fill="#e1edf8" stroke="#607a91" stroke-width="1"/><text x="350" y="175" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2b5f9e">個別仕様</text>
<path d="M265.0 196.0 L265.0 252.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="265.0,262.0 258.0,250.0 272.0,250.0" fill="#607a91"/>
<rect x="150" y="262" width="230" height="50" rx="12" fill="#fcfdfd" stroke="#607a91" stroke-width="1"/><text x="265" y="294" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">テストコード（Vitest）</text>
<text x="265" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#2b5f9e">インプットは個別の成果物</text>
<rect x="530" y="90" width="410" height="250" rx="12" fill="#eef3f1" stroke="#8ea6b2" stroke-width="1"/>
<text x="735" y="120" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6a4ea6">FE内部結合テストの生成</text>
<path d="M645.0 160.0 L835.0 160.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<path d="M645.0 160.0 L645.0 210.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<path d="M645.0 160.0 L835.0 210.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<path d="M835.0 160.0 L645.0 210.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<path d="M835.0 160.0 L835.0 210.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<path d="M645.0 210.0 L835.0 210.0" stroke="#8a6cc1" stroke-width="2" fill="none"/>
<rect x="560" y="140" width="170" height="40" rx="20.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="645" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">画面仕様</text>
<rect x="750" y="140" width="170" height="40" rx="20.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="835" y="165" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">画面遷移</text>
<rect x="560" y="190" width="170" height="40" rx="20.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="645" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">状態遷移</text>
<rect x="750" y="190" width="170" height="40" rx="20.0" fill="#e9e4f5" stroke="#8a6cc1" stroke-width="1"/><text x="835" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#6a4ea6">API契約（OpenAPI）</text>
<path d="M735.0 236.0 L735.0 252.0" stroke="#607a91" stroke-width="3" fill="none"/><polygon points="735.0,262.0 728.0,250.0 742.0,250.0" fill="#607a91"/>
<rect x="565" y="262" width="340" height="50" rx="12" fill="#fcfdfd" stroke="#8a6cc1" stroke-width="1"/><text x="735" y="294" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#223e53">テストコード（Testing Library＋MSW）</text>
<text x="735" y="366" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#6a4ea6">インプットは成果物間の関係</text>
<text x="500" y="404" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#55646d">内部結合のテストは、画面・遷移・状態・API契約の整合を前提にするので、関係ごと理解させる</text>
</svg>
